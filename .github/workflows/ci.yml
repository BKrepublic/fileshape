name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and typecheck
        run: npm test

      - name: Local corpus regressions when samples are available
        shell: bash
        run: |
          if [[ -d local-samples ]]; then
            npm run verify:ruby
            npm run verify:semantic
            npm run verify:stage2
          else
            echo "local-samples is not present on this runner; corpus regressions are local-only."
          fi
