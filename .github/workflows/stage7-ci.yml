name: Stage 7 CI

on:
  push:
    branches:
      - stage7-pdf-to-epub-cli
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and typecheck
        run: npm test

      - name: Verify ruby corpus
        run: npm run verify:ruby

      - name: Verify semantic samples
        run: npm run verify:semantic

      - name: Verify Stage 2 full corpus
        run: npm run verify:stage2
